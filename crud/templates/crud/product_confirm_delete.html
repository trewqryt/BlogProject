<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Удаление товара</title>
</head>
<body>
    <h1>Удаление товара</h1>

    <p>Вы уверены, что хотите удалить {{ product.name }}?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>

    <br>

    <a href="{% url 'product_list' %}">
        Отмена
    </a>
</body>
</html>
